[package]
name = "horizon-mod-converter"
version = "1.0.0"
edition = "2021"
description = "Convertit le contenu des mods Minecraft Java (.jar) en mods Horizon (.hmod) et les regroupe en modpacks partageables."
license = "MIT"
readme = "README.md"

[[bin]]
name = "horizon-mod-converter"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
self-replace = "1"
semver = "1"
dirs = "6"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
