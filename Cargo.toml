[package]
name = "oxyde"
version = "1.1.0"
edition = "2021"
description = "Magasin de mods, convertisseur de mods Java et lanceur pour Horizon (Minecraft Rust Edition)."
license = "MIT"
authors = ["full_money"]
readme = "README.md"

[[bin]]
name = "oxyde"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.15"
zip = { version = "2", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
sha2 = "0.10"
self-replace = "1"
semver = "1"
dirs = "6"
egui_extras = { version = "0.31", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
